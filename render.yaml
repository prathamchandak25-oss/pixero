services:
  - type: web
    name: pixero
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backened:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
